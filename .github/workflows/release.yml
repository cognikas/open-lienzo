name: release

# A published release → multi-arch image on GHCR (with SBOM and provenance), a Trivy gate on the pushed image,
# and the plugin zip + source tarball attached to the release. Called by release-please.yml, or runs on a
# release published by hand.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions: {}

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max

  scan:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Trivy gate on the pushed image (CRITICAL fails the release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (immutable; see ci.yml)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  assets:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Plugin zip and source tarball
        run: |
          (cd plugin && zip -qr "../open-lienzo-plugin-${TAG}.zip" .)
          git archive --format=tar.gz --prefix="open-lienzo-${TAG#v}/" -o "open-lienzo-${TAG}-src.tar.gz" HEAD
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "open-lienzo-plugin-${TAG}.zip" "open-lienzo-${TAG}-src.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
